name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Dependency download uses normal CI network; the test execution
      # itself makes no external API/service calls (absent binaries and
      # SDKs are mocked or skip by design).
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest

  distribution:
    name: clean install from the wheel
    runs-on: ubuntu-latest
    needs: test
    env:
      RUN_DISTRIBUTION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The dev extra includes `build`.
      - name: Install tooling
        run: python -m pip install -e ".[dev]"
      # Builds the wheel, installs it into a fresh venv outside the repo
      # (PYTHONPATH scrubbed) and drives the installed CLI.
      - name: Distribution tests
        run: pytest tests/packaging -v

  epubcheck:
    # The job name hardcodes the pinned version: GitHub's context
    # rules exclude `env` from jobs.<id>.name (only github, needs,
    # strategy, matrix, vars are available there), and referencing it
    # made run #1 fail workflow validation with zero jobs created.
    # Keep this name in sync with EPUBCHECK_VERSION below.
    name: real EPUBCheck conformance (pinned 5.1.0)
    runs-on: ubuntu-latest
    needs: test
    env:
      EPUBCHECK_VERSION: "5.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      # Pinned release, never "latest": validator-conformance jobs must be
      # reproducible. The engine resolves `epubcheck` through shutil.which,
      # so a wrapper on PATH is sufficient.
      - name: Install EPUBCheck (pinned)
        run: |
          curl -sSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          sudo unzip -q /tmp/epubcheck.zip -d /opt
          printf '#!/bin/sh\nexec java -jar /opt/epubcheck-%s/epubcheck.jar "$@"\n' \
            "${EPUBCHECK_VERSION}" | sudo tee /usr/local/bin/epubcheck > /dev/null
          sudo chmod +x /usr/local/bin/epubcheck
          epubcheck --version
      - name: Conformance tests (hard-fail when the binary is missing)
        env:
          REQUIRE_EPUBCHECK: "1"
        run: pytest -k epubcheck

  # Ace by DAISY CI is deliberately deferred (Decision B, Phase 15 v2);
  # its integration is exercised locally and mocked in the unit suite.
